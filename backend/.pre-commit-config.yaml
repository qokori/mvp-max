repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff-lint
        entry: ruff check --fix
        language: system
        types: [python]

      - id: ruff-format
        name: ruff-format
        entry: ruff format
        language: system
        types: [python]

      - id: mypy
        name: mypy
        entry: mypy . --ignore-missing-imports --disable-error-code import-untyped
        language: system
        types: [python]
        pass_filenames: false
