[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django-cors-headers>=4.9.0",
    "django-stubs>=6.0.3",
    "djangorestframework>=3.17.1",
    "mypy>=1.20.2",
    "pre-commit>=4.6.0",
    "ruff>=0.15.12",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.13"
check_untyped_defs = true
warn_unused_ignores = false
ignore_missing_imports = true
plugins = ["django-stubs"]
disable_error_code = ["import-untyped", "import-not-found", "var-annotated"]

[[tool.mypy.overrides]]
module = ["rest_framework.*", "django.*", "corsheaders.*", "tests.*"]
ignore_missing_imports = true
ignore_errors = true

[tool.django-stubs]
django_settings_module = "config.settings"
